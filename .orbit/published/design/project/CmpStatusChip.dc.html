<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400&family=Antonio:wght@600&display=swap" rel="stylesheet"><style>
body{margin:0}html,body{background:#050609}*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
kbd{font:500 12px/18px 'Inter','Helvetica','Arial',sans-serif;padding:2px 6px;border-radius:4px;border:1px solid rgba(204,204,220,.2);background:#23262c;color:#c9cdd3}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:9999px;border:1px dashed #5a4d33;color:#c8b88f;font:500 12px/18px 'Inter','Helvetica','Arial',sans-serif}@keyframes clkb{50%{opacity:.25}}/*updates*/.nw2{margin-left:6px;padding:1px 6px;border-radius:4px;background:#58cfec;color:#07181d;font:500 11px/16px 'Inter','Helvetica','Arial',sans-serif;vertical-align:1px}.upc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:4px;background:#17233b;color:#6e9fff;box-shadow:inset 0 0 0 1px rgba(110,159,255,.35);font:400 12px/18px 'Inter','Helvetica','Arial',sans-serif}/*lifecycle*/.lst{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;flex:none;line-height:0}.lst .i{width:16px;height:16px}.lst.g-n,.lsc.g-n{background:#262a31;color:#c9cdd3}.lst.g-p,.lsc.g-p{background:#17233b;color:#6e9fff}.lst.g-a,.lsc.g-a{background:#2e2417;color:#fbad37}.lst.g-v,.lsc.g-v{background:#2a1f33;color:#b877d9}.lst.g-r,.lsc.g-r{background:#14313a;color:#58cfec}.lst.g-k,.lsc.g-k{background:#1c2b20;color:#73bf69}.lst.g-f,.lsc.g-f{background:#3a1c27;color:#ff5286}.lsl{font-weight:500}.lsl.g-n{color:#c9cdd3}.lsl.g-p{color:#6e9fff}.lsl.g-a{color:#fbad37}.lsl.g-v{color:#b877d9}.lsl.g-r{color:#58cfec}.lsl.g-k{color:#73bf69}.lsl.g-f{color:#ff5286}.lsc{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;font:500 12px/18px Inter,Helvetica,Arial,sans-serif;white-space:nowrap}.lsc .i{width:14px;height:14px}/*badges*/html body :is(.lsc,.nw2,.upc,.chp,.pill){display:inline-flex;align-items:center;justify-content:center;align-self:center;box-sizing:border-box;height:22px;min-height:22px;padding:2px 8px;border-radius:4px;font:500 12px/18px Inter,Helvetica,Arial,sans-serif;white-space:nowrap;vertical-align:middle;flex:none}html body .nw2{padding:2px 6px;margin-left:0}html body :is(.lsc,.upc,.pill) svg{flex:none;display:block}/*userhover*/button[aria-label="User menu"]{transition:background-color .12s}button[aria-label="User menu"]:hover,button[aria-label="User menu"]:focus-visible{background:rgba(204,204,220,.08)!important;outline:0}/*slothover: add slot hover = darker shade of the app accent, solid accent border, accent icon*/.dk .n.slot:not(.on):not(.opn):hover,.dk .n.slot:not(.on):not(.opn):focus-visible,.dk .mods .n.slot:not(.on):not(.opn):hover,.dk .mods .n.slot:not(.on):not(.opn):focus-visible,.dk .mods .n.slot.hv{background:color-mix(in srgb,var(--mac,#6e9fff) 38%,#0b0c0e);border:1px solid var(--mac,#6e9fff);color:var(--mac,#6e9fff);border-radius:6px}</style>
</helmet>

roke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg></sc-if><sc-if value="{{ i_ready }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></sc-if><sc-if value="{{ i_enabled }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if><sc-if value="{{ i_disabled }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg></sc-if><sc-if value="{{ i_failed }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg></sc-if></span></sc-if><sc-if value="{{ isLabel }}" hint-placeholder-val="{{ false }}"><span class="{{ cls }}">{{ label }}</span></sc-if><sc-if value="{{ isChip }}" hint-placeholder-val="{{ true }}"><span class="{{ cls }}"><sc-if value="{{ i_notinit }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3.6"/></svg></sc-if><sc-if value="{{ i_progress }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg></sc-if><sc-if value="{{ i_review }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></sc-if><sc-if value="{{ i_setup }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="14" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg></sc-if><sc-if value="{{ i_setupwip }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></sc-if><sc-if value="{{ i_migrate }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg></sc-if><sc-if value="{{ i_ready }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></sc-if><sc-if value="{{ i_enabled }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if><sc-if value="{{ i_disabled }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg></sc-if><sc-if value="{{ i_failed }}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg></sc-if>{{ label }}</span></sc-if><sc-if value="{{ isNew }}" hint-placeholder-val="{{ false }}"><span class="nw2" style="margin-left:0">New</span></sc-if><sc-if value="{{ isUpd }}" hint-placeholder-val="{{ false }}"><span class="upc" title="{{ title }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"></circle><path d="m16 12-4-4-4 4"></path><path d="M12 16V8"></path></svg>{{ label }}</span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["icon","label","chip","new","update"],"default":"chip"},"status":{"editor":"enum","options":["notinit","initializing","review","setup","setupwip","validating","migrate","migrating","ready","enabled","disabled","failed","busy"],"default":"enabled"},"label":{"editor":null},"$preview":{"width":240,"height":60}}'>
class Component extends DCLogic {
// StatusChip (R10, R12): the one badge box. With it, AppStatus: the lifecycle status model, 13 statuses in 7 colour groups, which
// lc_compose.py takes from tools/lifecycle_kit.py at build time, so these boards and the Python-built lifecycle boards never differ.
// kind: 'icon' (the AppStatus icon, 28 px, not a button), 'label' (status name), 'chip' (icon and name), 'new', 'update' (label: version).
renderVals() {
const S = {"notinit": {"label": "Not initialized", "icon": "notinit", "tone": "n", "desc": "Installed and discovered, but initialization has not run."}, "initializing": {"label": "Initializing", "icon": "progress", "tone": "p", "desc": "Checks and available self-tests are running."}, "review": {"label": "Review required", "icon": "review", "tone": "a", "desc": "Required initialization checks passed and results await approval. Also after an update that brings new permissions, data sources or pages; the app is then in maintenance mode (Org Admins only)."}, "setup": {"label": "Setup required", "icon": "setup", "tone": "v", "desc": "Review accepted; configuration is needed. After an update: only the new or changed items; the rest of the setup is kept."}, "setupwip": {"label": "Setup in progress", "icon": "setupwip", "tone": "v", "desc": "Setup has started but is incomplete."}, "validating": {"label": "Validation in progress", "icon": "progress", "tone": "p", "desc": "Setup checks are running."}, "migrate": {"label": "Migration required", "icon": "migrate", "tone": "a", "desc": "Enabled, in maintenance mode (Org Admins only). A migration is pending; it starts by itself unless auto_migrate is off."}, "migrating": {"label": "Migration in progress", "icon": "progress", "tone": "p", "desc": "Migration is running; the app is in maintenance mode (Org Admins only)."}, "ready": {"label": "Ready to enable", "icon": "ready", "tone": "r", "desc": "Required checks and setup passed."}, "enabled": {"label": "Enabled", "icon": "enabled", "tone": "k", "desc": "The app is available to authorized users. After a simple update the app stays Enabled and shows an “Updated” note."}, "disabled": {"label": "Disabled", "icon": "disabled", "tone": "n", "desc": "The app is installed but unavailable for normal use."}, "failed": {"label": "Action required / Failed", "icon": "failed", "tone": "f", "desc": "A check, setup, migration, or another operation failed. A failed migration disables the app again. Also: a version older than the app’s database schema (downgrade)."}, "busy": {"label": "Updating / Uninstalling", "icon": "progress", "tone": "p", "desc": "A management operation is running."}};
// the seven colour groups, spelled out so the board keeps their rules
const TONE = { n: 'g-n', p: 'g-p', a: 'g-a', v: 'g-v', r: 'g-r', k: 'g-k', f: 'g-f' };
const p = this.props; const kind = p.kind || 'chip'; const s = S[p.status] || S.enabled; const ver = p.label || '0.1.1';
const v = { isIcon: kind === 'icon', isLabel: kind === 'label', isChip: kind === 'chip', isNew: kind === 'new', isUpd: kind === 'update',
label: kind === 'update' ? ver : s.label, title: kind === 'update' ? ver + ' is available' : s.label + '. ' + s.desc,
cls: (kind === 'icon' ? 'lst' : kind === 'label' ? 'lsl' : 'lsc') + ' ' + TONE[s.tone] };
Object.keys(S).forEach((k) => { v['i_' + S[k].icon] = S[k].icon === s.icon; });
return v;
}
}
</script>
