# Weekly: is there a Grafana release newer than the base of the orbit branch? Each release comes in through one update/<tag> pull request.
# Opens (or updates) one issue for the owner. Changes nothing in the repository.
name: orbit-upstream-watch

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare with Grafana's tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(node -p "require('./.orbit/seams.json').base")
          TAGS=$(git ls-remote --tags --refs https://github.com/grafana/grafana.git 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          NEWER=$(printf '%s\n%s\n' "$TAGS" "$BASE" | sort -V -u | sed -n "/^${BASE//./\\.}\$/,\$p" | tail -n +2)
          {
            echo "Grafana base of orbit: \`$BASE\`"
            echo "Newer Grafana releases: $(echo $NEWER | sed 's/ /, /g')"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$NEWER" ]; then
            NEXT=$(echo "$NEWER" | head -1)
            TITLE="orbit(update): Grafana $NEXT is available"
            printf '\n\nAsk Claude Code: "bring Grafana %s into Orbit" (skill orbit-upstream-update: branch update/%s from orbit, merge the tag, pull request with a merge commit). Default branch and settings stay as they are.\n' "$NEXT" "$NEXT" >> summary.md
            if ! gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$TITLE" --body-file summary.md
            fi
          fi
