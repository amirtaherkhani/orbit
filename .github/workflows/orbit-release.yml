# Release on a tag v<grafana>+orbit.<n> or v<grafana>+orbit.<n>.rc.<m> (.claude/rules/orbit-git.md).
# Builds Grafana with Orbit from Grafana's Dockerfile, pushes ghcr.io/<owner>/orbit:<grafana>-orbit.<n>[-rc.<m>],
# and creates the GitHub release from .orbit/CHANGELOG.md. Release candidates are marked pre-release.
name: orbit-release

on:
  push:
    tags: ['v*+orbit.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "
            import { RELEASE_TAG, dockerTag } from './.orbit/scripts/lib.mjs';
            const t = process.env.TAG; const m = RELEASE_TAG.exec(t);
            if (!m) { console.error('✘ not a release tag: ' + t); process.exit(1); }
            console.log('image=' + dockerTag(t)); console.log('grafana=' + m[1]); console.log('rc=' + (m[3] ? 'true' : 'false'));
          " >> "$GITHUB_OUTPUT"
      - name: Tag matches the line's Grafana base
        run: |
          BASE=$(node -p "require('./.orbit/seams.json').base")
          test "$BASE" = "v${{ steps.tag.outputs.grafana }}" || { echo "✘ tag is for v${{ steps.tag.outputs.grafana }}, but .orbit/seams.json base is $BASE"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/orbit:${{ steps.tag.outputs.image }}
          labels: |
            org.opencontainers.image.title=Orbit
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/orbit:${{ steps.tag.outputs.image }}
          RC: ${{ steps.tag.outputs.rc }}
        run: |
          awk -v t="## [$TAG]" 'index($0,t)==1{f=1;next} /^## \[/{f=0} f' .orbit/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release candidate. Changes since the last release: see ## [Unreleased] in .orbit/CHANGELOG.md." > notes.md
          printf '\n\nImage: `%s`\n' "$IMAGE" >> notes.md
          FLAG=""; [ "$RC" = "true" ] && FLAG="--prerelease"
          gh release create "$TAG" --verify-tag --title "Orbit $TAG" --notes-file notes.md $FLAG
